        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body,
        #root {
            height: 100%;
            width: 100%;
            overflow: hidden
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: #F5E6E2;
            letter-spacing: -0.01em
        }

        input,
        select,
        button,
        textarea {
            font-family: inherit
        }

        ::-webkit-scrollbar {
            width: 0;
            display: none
        }

        @keyframes shake {

            0%,
            100% {
                transform: rotate(0)
            }

            25% {
                transform: rotate(-10deg)
            }

            75% {
                transform: rotate(10deg)
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.05)
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .fade-up {
            animation: fadeUp 0.6s ease-out backwards
        }
        .stepper-wrap{display:flex;align-items:center;gap:0;padding:8px 4px}
        .stepper-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border:2px solid #EDE7E4;color:#9A8E89;background:#fff;transition:all 0.3s}
        .stepper-dot.active{border-color:#E89A8E;background:#E89A8E;color:#fff}
        .stepper-dot.done{border-color:#7BC67E;background:#7BC67E;color:#fff}
        .stepper-line{height:2px;flex:1;min-width:12px;background:#EDE7E4;transition:background 0.3s}
        .stepper-line.done{background:#7BC67E}
        .stepper-line.active{background:linear-gradient(90deg,#7BC67E,#E89A8E)}
        .progress-bar{height:6px;border-radius:3px;background:#EDE7E4;overflow:hidden;margin:4px 0}
        .progress-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
        .filter-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid rgba(232,154,142,0.2);background:#fff;color:#3D3530;transition:all 0.2s;flex-shrink:0;white-space:nowrap}
        .filter-chip.active{background:#E89A8E;color:#fff;border-color:#E89A8E}
        .reward-card{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #EDE7E4;transition:all 0.2s}
        .reward-card.can-redeem{border-color:rgba(232,154,142,0.4);box-shadow:0 2px 8px rgba(232,154,142,0.12)}
        .reward-card.almost{border-color:rgba(240,196,155,0.5);box-shadow:0 2px 8px rgba(240,196,155,0.12)}
    </style>

            const extractDriveImageId = url => {
                const raw = String(url || "").trim();
                if (!raw || !raw.includes("drive.google.com")) return "";
                const fileMatch = raw.match(/drive\.google\.com\/file\/d\/([^/]+)/);
                if (fileMatch) return decodeURIComponent(fileMatch[1]);
                const idMatch = raw.match(/[?&]id=([^&]+)/);
                if (idMatch) return decodeURIComponent(idMatch[1]);
                return "";
            };
            const normalizeDriveImageUrl = url => {
                const raw = String(url || "").trim();
                if (!raw) return "";
                const driveId = extractDriveImageId(raw);
                if (driveId) return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(driveId)}`;
                return raw;
            };
            const parseProductImages = value => {
                if (!value) return [];
                if (Array.isArray(value)) return value.map(normalizeDriveImageUrl).filter(Boolean);
                if (typeof value === "object") return parseProductImages(value.url || value.src || "");
                const raw = String(value || "").trim();
                if (!raw) return [];
                try { return parseProductImages(JSON.parse(raw)); } catch {}
                if (raw.includes("\n")) return raw.split(/\r?\n/).map(normalizeDriveImageUrl).filter(Boolean);
                if (raw.includes(",") && !raw.startsWith("data:image/")) return raw.split(",").map(normalizeDriveImageUrl).filter(Boolean);
                return [normalizeDriveImageUrl(raw)].filter(Boolean);
            };

            };
            const driveImageVariants = src => {

                const id = extractDriveImageId(raw);
                if (!id) return [raw];
                const safeId = encodeURIComponent(id);
                return [

                    const img = new Image();
                    img.onerror = reject;
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        const draw = side => {
                            const scale = Math.min(1, side / Math.max(img.width, img.height));
                            canvas.width = Math.max(1, Math.round(img.width * scale));
                            canvas.height = Math.max(1, Math.round(img.height * scale));
                            ctx.fillStyle = "#fff";
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        let side = 1080;
                        let quality = 0.86;
                        draw(side);
                        let dataUrl = canvas.toDataURL("image/jpeg", quality);
                        while (dataUrl.length > PRODUCT_IMAGE_TARGET_CHARS && side > 420) {
                            if (quality > 0.62) quality -= 0.06;
                            else { side = Math.round(side * 0.86); quality = 0.78; draw(side); }
                            dataUrl = canvas.toDataURL("image/jpeg", quality);
                        }
                        resolve({ url: dataUrl, name: file.name, size: dataUrl.length });
                    };
                    img.src = ev.target.result;
                };

                            {/* TAB: TÀI KHOẢN */}

                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>}

                    <Inp label="Họ tên người nhận" value={shipName} onChange={setShipName} />
                    <Inp label="SĐT người nhận" value={shipPhone} onChange={v => setShipPhone(v.replace(/\D/g, ""))} type="tel" />
                    <AddrPick city={shipCity} setCity={setShipCity} d={shipD} setD={setShipD} w={shipW} setW={setShipW} s={shipSt} setS={setShipSt} />
                </div><div style={{ padding: "10px 14px", background: "#fff", borderTop: "1px solid #f0ebe8", flexShrink: 0 }}>
                    <Btn primary full onClick={async () => {
                        if (!shipName || !/^0\d{9}$/.test(shipPhone) || !shipCity || !shipD || !shipW || !shipSt) { show("Vui lòng điền đầy đủ địa chỉ và SĐT hợp lệ!"); return }
                        const newAddr = `${shipSt}, ${shipW}, ${shipD}, ${shipCity}`;
                        const shipData = { name: shipName, phone: shipPhone, addr: newAddr, city: shipCity, district: shipD, ward: shipW };
                        try {
                            const res = await sheetCall({ action: "confirmOrderAddr", phone: user.phone, orderId: confirmingOrder.id, ship: shipData });
                            if (res?.status !== "ok") { show(res?.message || "Không xác nhận được địa chỉ"); return; }
                        } catch { show("Lỗi kết nối. Địa chỉ chưa được xác nhận."); return; }
                        setOrders(prev => prev.map(o => o.id === confirmingOrder.id ? { ...o, addressConfirmed: true, ship: shipData } : o));
                        show("✅ Đã xác nhận địa chỉ giao hàng!");
                        setConfirmingOrder(null); setScreen("orders");
                    }}>Xác nhận giao đến địa chỉ này</Btn>
                </div></div>}

                {screen === "redeemShip" && <div style={FS}>{renderHead("Nhận quà")}<div style={{ flex: 1, overflow: "auto", padding: 14 }}>
                    <Inp label="Họ tên" value={shipName} onChange={setShipName} />
                    <Inp label="SĐT" value={shipPhone} onChange={v => setShipPhone(v.replace(/\D/g, ""))} type="tel" />
                    <AddrPick city={shipCity} setCity={setShipCity} d={shipD} setD={setShipD} w={shipW} setW={setShipW} s={shipSt} setS={setShipSt} />
                </div><div style={{ padding: "10px 14px", background: "#fff", borderTop: "1px solid #f0ebe8", flexShrink: 0 }}><Btn primary full onClick={confirmRedeem}>Xác nhận — {redeemItem?.cost} coin</Btn></div></div>}

                {screen === "myqr" && <div style={FS}>{renderHead("Mã QR Coin")}
                    <div style={{ flex: 1, overflow: "auto", padding: 16, textAlign: "center" }}>
                        <div style={{ background: "#fff", borderRadius: 16, padding: 20, marginBottom: 16 }}>
                            <div style={{ fontSize: 16, fontWeight: 700, color: C.brown, marginBottom: 4 }}>{user?.name}</div>
                            <div style={{ fontSize: 12, color: C.tl, marginBottom: 12 }}>Đưa mã QR cho đối tác quét để sử dụng coin</div>
                            <div id="qrcode-container" style={{ display: "inline-block", padding: 12, background: "#fff", borderRadius: 12, border: `2px solid ${C.primary}30` }} ref={el => {
                                if (el && !el.dataset.rendered && user?.phone) {
                                    el.innerHTML = "";
                                    try { new QRCode(el, { text: "DUYEN_COIN:" + user.phone, width: 180, height: 180, colorDark: "#3D3530", colorLight: "#ffffff" }); } catch(e) {}
                                    el.dataset.rendered = "1";
                                }
                            }}></div>
                            <div style={{ marginTop: 12, fontSize: 20, fontWeight: 800, color: C.gold, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>{I.coin(22)} {coins} coin</div>
                        </div>
                        <div style={{ background: C.ov, borderRadius: 12, padding: 12, fontSize: 13, color: C.brown, lineHeight: 1.5 }}>
                            <div style={{ fontWeight: 700, marginBottom: 4 }}>💡 Cách sử dụng:</div>
                            1. Vào quán đối tác của Duyên<br/>
                            2. Đưa mã QR này cho nhân viên quét<br/>
                            3. Coin sẽ được trừ tự động, bạn nhận ưu đãi ngay
                        </div>
                    </div>
                </div>}

                {screen === "tuvi" && (() => {
                    const report = user?.dob ? analyzeTuVi(user.dob, user.birthTime || 'ty', user.gender || 'nam') : null;
                    return (
                        <div style={FS}>{renderHead("Tử Vi Bản Mệnh", null, () => setScreen(null))}
                            <div style={{ flex: 1, overflow: "auto", padding: 12, paddingBottom: 40 }}>
                                {!report ? (
                                    /* PROFILE DATA FILL IN FORM */
                                    <div style={{ background: "#fff", borderRadius: 14, padding: 16, border: "1px solid #EDE7E4" }}>
                                        <div style={{ fontSize: 32, textAlign: "center", marginBottom: 8 }}>🔮</div>
                                        <div style={{ fontSize: 16, fontWeight: 700, color: C.brown, textAlign: "center", marginBottom: 4 }}>Giải Mã Lá Số Tử Vi</div>
                                        <div style={{ fontSize: 13, color: C.tl, textAlign: "center", marginBottom: 16 }}>Vui lòng điền thông tin chính xác theo ngày giờ sinh để đo bản mệnh</div>
                                        
                                        <Inp label="Họ tên" value={eName || user?.name || ""} onChange={setEName} />
                                        <Sel label="Giới tính" value={user?.gender || "nam"} onChange={v => setUser(u => ({ ...u, gender: v }))} options={["nam", "nu"]} />
                                        <Inp label="Ngày sinh (Dương lịch)" type="date" value={user?.dob || ""} onChange={v => setUser(u => ({ ...u, dob: v }))} />
                                        <Sel label="Giờ sinh" value={user?.birthTime || "ty"} onChange={v => setUser(u => ({ ...u, birthTime: v }))} options={["ty", "suu", "dan", "mao", "thin", "ti", "ngo", "mui", "than", "dau", "tuat", "hoi"]} />
                                        
                                        <Btn primary full onClick={async () => {
                                            if (!user?.dob) { show("Vui lòng điền ngày sinh!"); return }
                                            const nameToSave = eName || user?.name || "Khách";
                                            try {
                                                const updates = { name: nameToSave, dob: user.dob, gender: user.gender || "nam", birthTime: user.birthTime || "ty" };
                                                const res = await sheetCall({ action: "update", phone: user.phone, updates });
                                                if (res?.status !== "ok") { show(res?.message || "Không lưu được thông tin"); return; }
                                                setUser(u => ({ ...u, name: nameToSave }));
                                                show("Đã phân tích lá số thành công! 🔮");
                                            } catch (err) {
                                                show("Lỗi kết nối. Thông tin chưa được lưu.");
                                            }
                                        }}>🔮 Xem phân tích Tử Vi</Btn>
                                    </div>
                                ) : (
                                    /* FULL DETAILED ASTROLOGICAL REPORT */
                                    <div>
                                        {/* HEADER SUMMARY CARD */}
                                        <div style={{ background: "linear-gradient(135deg,#9B8EC4,#776B66)", borderRadius: 14, padding: 16, color: "#fff", marginBottom: 16, boxShadow: "0 4px 14px rgba(155,142,196,0.25)" }}>
                                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                                                <div style={{ fontSize: 18, fontWeight: 800 }}>{user.name}</div>
                                                <span style={{ fontSize: 12, fontWeight: 700, background: "rgba(255,255,255,0.25)", padding: "3px 8px", borderRadius: 6 }}>{report.cungHoangDao}</span>
                                            </div>
                                            <div style={{ fontSize: 13, opacity: 0.9, marginBottom: 8 }}>Can Chi: <strong>{report.canChi}</strong> · Mệnh <strong>{report.menh}</strong></div>
                                            <div style={{ fontSize: 13, background: "rgba(255,255,255,0.15)", borderRadius: 8, padding: "8px 10px" }}>
                                                🔢 Số đạo đời (Life Path): <strong>{report.lifePathNumber}</strong> ({report.numType}) · Hợp số: {report.numMatch}
                                            </div>
                                        </div>

                                        {/* DETAILED TABS */}
                                        <div style={{ display: "flex", gap: 4, overflowX: "auto", marginBottom: 12, paddingBottom: 4 }}>
                                            {[{ id: "banMenh", l: "Bản Mệnh", e: "🔮" }, { id: "tinhDuyen", l: "Tình Duyên", e: "💞" }, { id: "suNghiep", l: "Sự Nghiệp", e: "💼" }, { id: "sucKhoe", l: "Sức Khỏe", e: "🌱" }].map(t => (
                                                <div key={t.id} onClick={() => setHoroTab(t.id)} style={{ minWidth: "fit-content", background: horoTab === t.id ? C.primary : "#fff", color: horoTab === t.id ? "#fff" : C.text, borderRadius: 18, padding: "6px 12px", cursor: "pointer", border: "1px solid #EDE7E4", fontSize: 12, fontWeight: horoTab === t.id ? 700 : 500, flexShrink: 0 }}>
                                                    {t.e} {t.l}
                                                </div>
                                            ))}
                                        </div>

                                        {/* TAB CONTENT CARDS */}
                                        <div style={{ background: "#fff", borderRadius: 14, padding: 16, border: "1px solid #EDE7E4", minHeight: 220 }}>
                                            {horoTab === "banMenh" && (
                                                <div>
                                                    <h4 style={{ fontSize: 14, color: C.brown, marginBottom: 8 }}>🪐 Bản Mệnh Chi Tiết</h4>
                                                    <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>
                                                        • <strong>Thiên Can:</strong> {report.canStr} — <em>{report.canMeaning}</em>.<br />
                                                        • <strong>Địa Chi:</strong> {report.chiStr} — <em>{report.chiMeaning}</em>.<br />
                                                        • <strong>Giờ Sinh:</strong> {report.gioTrait}.<br /><br />
                                                        <strong>Cốt cách tính cách:</strong> {report.core}
                                                    </div>
                                                </div>
                                            )}

                                            {horoTab === "tinhDuyen" && (
                                                <div>
                                                    <h4 style={{ fontSize: 14, color: C.brown, marginBottom: 8 }}>💞 Bản Đồ Tình Duyên</h4>
                                                    <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>
                                                        • <strong>Phong cách yêu:</strong> {report.loveStyle}<br /><br />
                                                        • <strong>Nhược điểm cần lưu ý:</strong> {report.weakPoint}<br /><br />
                                                        • <strong>Mệnh lý tương sinh tốt nhất:</strong> {report.hopMenh}<br />
                                                        • <strong>Nhóm tuổi tam hợp & lục hợp:</strong> {report.numMatch} ({report.partners})
                                                    </div>
                                                </div>
                                            )}

                                            {horoTab === "suNghiep" && (
                                                <div>
                                                    <h4 style={{ fontSize: 14, color: C.brown, marginBottom: 8 }}>💼 Sự Nghiệp & Vận Hạn</h4>
                                                    <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>
                                                        • <strong>Lĩnh vực định hướng:</strong> {report.suNghiep}<br /><br />
                                                        • <strong>Tài vận trong năm 2025–2026:</strong> {report.fortune}<br /><br />
                                                        • <strong>Chỉ dẫn may mắn:</strong><br />
                                                        - Hướng tốt: {report.luckyDirection}<br />
                                                        - Màu may mắn: {report.luckyColors}<br />
                                                        - Con số cát tường: {report.luckyNumbers}
                                                    </div>
                                                </div>
                                            )}

                                            {horoTab === "sucKhoe" && (
                                                <div>
                                                    <h4 style={{ fontSize: 14, color: C.brown, marginBottom: 8 }}>🌱 Chỉ Dẫn Sức Khỏe</h4>
                                                    <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>
                                                        {report.sucKhoe || "Lưu ý giữ ấm cơ thể vào mùa lạnh, ăn uống đúng giờ để bảo vệ hệ tiêu hóa, duy trì các thói quen vận động như đi bộ hoặc yoga để điều hòa khí huyết."}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* CONVERSION BOTTOM CARD */}
                                        {!user?.isPaidND && Number(user?.match_status || 0) < 1 && (
                                            <div style={{ background: C.ov, borderRadius: 14, padding: 14, border: `1px dashed ${C.primary}30`, marginTop: 16, textAlign: "center" }}>
                                                <div style={{ fontSize: 13, color: C.brown, marginBottom: 8 }}>Tìm người hợp lá số & bản mệnh của bạn ngay hôm nay!</div>
                                                <Btn primary full onClick={() => setScreen("ndPackages")}>Đăng ký ghép đôi ngay</Btn>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                })()}

                <Toast_ msg={toast.msg} v={toast.v} />

                {/* TRỢ LÝ DUYÊN — Floating Bell (chỉ hiện khi đã login) */}
                {authStep === "done" && !screen && (
                    <div onClick={() => setShowNotiPanel(true)} style={{ position: "fixed", bottom: 80, right: 16, background: `linear-gradient(135deg,${C.primary},#C97A72)`, color: "#fff", width: 56, height: 56, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, boxShadow: "0 6px 20px rgba(232,154,142,0.45)", cursor: "pointer", zIndex: 55 }}>
                        💬
                        {notifications.filter(n => !n.read).length > 0 && (
                            <div style={{ position: "absolute", top: -2, right: -2, background: C.no, color: "#fff", fontSize: 11, fontWeight: 700, minWidth: 20, height: 20, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", border: "2px solid #fff", padding: "0 4px" }}>
                                {notifications.filter(n => !n.read).length}
                            </div>
                        )}
                    </div>
                )}

                {/* TRỢ LÝ DUYÊN — Notification Panel */}
                {showNotiPanel && (
                    <div onClick={() => setShowNotiPanel(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100 }}>
                        <div onClick={e => e.stopPropagation()} style={{ background: "#fff", width: "100%", maxWidth: 420, maxHeight: "75vh", borderRadius: "20px 20px 0 0", display: "flex", flexDirection: "column" }}>
                            <div style={{ padding: "16px 18px", borderBottom: "1px solid #EDE7E4", display: "flex", alignItems: "center", gap: 10 }}>
                                <div style={{ width: 40, height: 40, borderRadius: "50%", background: `linear-gradient(135deg,${C.primary},#C97A72)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, color: "#fff" }}>💬</div>
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontSize: 15, fontWeight: 800, color: C.brown }}>Trợ Lý Duyên</div>
                                    <div style={{ fontSize: 11, color: C.tl }}>Cập nhật thông tin & ưu đãi</div>
                                </div>
                                <div onClick={() => setShowNotiPanel(false)} style={{ fontSize: 22, color: C.tl, cursor: "pointer", padding: 4 }}>×</div>
                            </div>
                            <div style={{ flex: 1, overflow: "auto", padding: "12px 14px" }}>
                                {notifications.length === 0 ? (
                                    <div style={{ textAlign: "center", padding: "40px 20px", color: C.tl }}>
                                        <div style={{ fontSize: 40, marginBottom: 8 }}>💌</div>
                                        <div style={{ fontSize: 14, fontWeight: 600, color: C.brown }}>Chưa có thông báo</div>
                                        <div style={{ fontSize: 12, marginTop: 4 }}>Trợ Lý Duyên sẽ gửi cập nhật về tài khoản và ưu đãi mới</div>
                                    </div>
                                ) : notifications.map((n, i) => {
                                    const tColor = n.type === "payment" ? C.ok : n.type === "topup" ? C.gold : n.type === "match" ? C.primary : n.type === "earn" ? "#4CAF50" : n.type === "spend" ? "#E57373" : n.type === "order" ? "#7B8DE6" : n.type === "checkin" ? "#26A69A" : C.blue;
                                    const tBg = n.type === "payment" ? "#E8F5E9" : n.type === "topup" ? "#FFF8F0" : n.type === "match" ? "#FFF0ED" : n.type === "earn" ? "#E8F5E9" : n.type === "spend" ? "#FFF3F3" : n.type === "order" ? "#F0F2FF" : n.type === "checkin" ? "#E0F2F1" : "#E3F2FD";
                                    return (
                                        <div key={n.id || i} onClick={() => {
                                            if (!n.read) {
                                                sheetCall({ action: "markNotificationRead", id: n.id }).catch(() => {});
                                                setNotifications(prev => prev.map(x => x.id === n.id ? { ...x, read: true } : x));
                                            }
                                        }} style={{ background: n.read ? "#fff" : tBg, borderLeft: `3px solid ${tColor}`, borderRadius: 10, padding: "10px 12px", marginBottom: 8, cursor: "pointer", border: n.read ? "1px solid #EDE7E4" : `1px solid ${tColor}30` }}>
                                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                                                <div style={{ fontSize: 13, fontWeight: 700, color: C.brown, flex: 1 }}>{n.title}</div>
                                                {!n.read && <div style={{ width: 8, height: 8, borderRadius: "50%", background: tColor, flexShrink: 0, marginTop: 4 }}></div>}
                                            </div>
                                            <div style={{ fontSize: 12, color: C.text, marginTop: 4, lineHeight: 1.5 }}>{n.message}</div>
                                            <div style={{ fontSize: 10, color: C.tl, marginTop: 6 }}>{n.createdAt ? new Date(n.createdAt).toLocaleString("vi-VN") : ""}</div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                )}
            </div>);
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<DuyenApp />);
    </script>
</body>

</html>
